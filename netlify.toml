[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Set this to your Render backend URL after deploying the server
  # Example: VITE_SERVER_URL = "https://educonnect-server.onrender.com"
  VITE_SERVER_URL = "https://your-render-url.onrender.com"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
